<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>

    <link rel="stylesheet" href="css/materialize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <form class="col s12">
                <h1>Forms</h1>
            <div class="row">
                <div class="input-field col s6">
                <input placeholder="First name" id="first_name" type="text" class="validate">
                <label for="first_name">First Name</label>
                </div>
                <div class="input-field col s6">
                <input placeholder="Last name" id="last_name" type="text" class="validate">
                <label for="last_name">Last Name</label>
                </div>
            </div>
            <div class="row">
                <div class="input-field col s12">
                <input disabled value="I am not editable" id="disabled" type="text" class="validate">
                <label for="disabled">Disabled</label>
                </div>
            </div>
            <div class="row">
                <div class="input-field col s12">
                <input id="password" type="password" class="validate">
                <label for="password">Password</label>
                </div>
            </div>
            <div class="row">
                <div class="input-field col s12">
                <input id="email" type="email" class="validate">
                <label for="email">Email</label>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                This is an inline input field:
                <div class="input-field inline">
                    <input id="email_inline" type="email" class="validate">
                    <label for="email_inline">Email</label>
                    <span class="helper-text" data-error="wrong" data-success="right">Helper text</span>
                </div>
                </div>
            </div>
            </form>
        </div>

        <div class="row">
            <div class="col s12 m6 l6">
                <img src="images/table-setting.jpg" alt="" class="responsive-img">
            </div>
            <div class="col s12 m6 l6">
                <h3 class="center">Login to Your Account</h3>
                <form action="">
                    <div class="input-field">
                        <input type="text" placeholder="User Name" id="">
                        <label for="first_name">User Name</label>
                    </div>
                    <div class="input-field">
                        <input type="password" placeholder="Password" name="" id="">
                        <label for="password">Password</label>
                    </div>

                    <button class="btn btn-large center">Login</button>

                    <p><a href="">Forgot password?</a></p>
                </form>
            </div>
        </div>

        <h1>Custom Fonts</h1>
    </div>
</body>

<script src="js/jquery.js"></script>
<script src="js/materialize.js"></script>
<script>

</script>
</html>
